<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Аудиенция</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Georgia', serif; }
    
    /* Новый слой для черного экрана */
    #overlay { 
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
        background: #000; z-index: 9999; display: flex; 
        justify-content: center; align-items: center; transition: opacity 2s ease;
    }
    #enter-btn { opacity: 0; transition: opacity 2s ease; }

    #scene { width: 100vw; height: 100vh; position: relative; transition: filter 3s ease, opacity 2s ease; }
    #bg { width: 100vw; height: 100vh; background: url('throne_final.jpg') center/cover no-repeat; position: absolute; }
    
    #guests-backstage { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    .guest-back { position: absolute; bottom: 0; height: 40vh; z-index: 1; transition: 0.5s; }

    #active-guest { 
        position: absolute; bottom: 0; right: 50px; height: 60vh; z-index: 2; transition: 0.5s; 
        mask-image: linear-gradient(to top, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
    }

    #novel-box { 
        position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
        width: 800px; padding: 40px; background: rgba(253, 245, 208, 0.7);
        border: 4px solid #d4af37; border-radius: 50px; z-index: 10;
        display: flex; flex-direction: column; align-items: center;
        mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%);
    }

    #dialogue-text { 
        font-size: 1.6rem; color: #4a3b2c; font-weight: bold; text-align: center; height: 60px; 
        white-space: pre-wrap;
    }
    .btn { padding: 15px 35px; cursor: pointer; background: #d4af37; color: #fff; border: none; border-radius: 20px; font-weight: bold; font-size: 1.2rem; }
    
    #gift-popup { 
        position: absolute; top: 15%; right: 10%; color: #fff; font-size: 2.5rem; font-weight: bold; 
        text-shadow: 0 0 15px #ffd700, 0 0 25px #ffd700; opacity: 0; transition: 1s; z-index: 20;
    }

    .speech-bubble { 
        position: absolute; background: #fff; padding: 15px 20px; border-radius: 30px; border: 3px solid #d4af37; 
        z-index: 5; font-size: 1.4rem; font-weight: bold; color: #d4af37;
        opacity: 0; transition: opacity 2s ease;
    }
    
    #final-text { 
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
        color: #d4af37; font-size: 4rem; z-index: 100; opacity: 0; transition: 2s; 
        text-shadow: 0 0 20px #000, 0 0 50px #d4af37; pointer-events: none; text-align: center;
    }
  </style>
</head>
<body>

<audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>

<!-- Черный экран с кнопкой -->
<div id="overlay">
    <button class="btn" id="enter-btn" onclick="enterGame()">Войти</button>
</div>

<div id="scene">
    <div id="bg"></div>
    <div id="guests-backstage"></div>
    <img id="active-guest" src="" alt="Гость">
    <div id="gift-popup"></div>
    
    <div id="novel-box">
        <div id="dialogue-text"></div>
        <button class="btn" id="start-btn" onclick="startAudience()">Начать прием</button>
        <div id="choice-buttons" style="display: none; gap: 20px;">
            <button class="btn" onclick="makeChoice(true)">Принять</button>
            <button class="btn" onclick="makeChoice(false)">Отказать</button>
        </div>
    </div>
</div>
<div id="final-text">Тронный зал покорен.<br>Вы прекрасный король.</div>

<script>
    // Появление кнопки Войти
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('enter-btn').style.opacity = '1';
        }, 500);
    };
function enterGame() {
        document.getElementById('bg-music').play(); // Включаем музыку
        document.getElementById('overlay').style.opacity = '0'; // Рассеиваем черный экран
        setTimeout(() => { document.getElementById('overlay').style.display = 'none'; }, 2000);
    }

    let step = 0;
    const music = document.getElementById('bg-music');
    const allSprites = ['фото1.png','фото2.png','фото3.png','фото4.png','фото5.png','фото6.png','фото7.png','фото8.png','фото9.png','фото10.png','фото11.png','фото12.png','фото13.png','фото14.png','фото15.png'];
    const comps = ["СЛАВА КОРОЛЮ!", "ЛЮБИМ ВАС!", "ВЕЛИКИЙ!", "НАШ ГОСПОДИН!", "УРА-А-А!", "НАШ ГЕРОЙ!", "СИЯЕТЕ!", "ДОЛГИХ ЛЕТ!", "МОЙ КОРОЛЬ!", "ЛУЧШИЙ!"];
    const scripts = [
        { img: 'фото4.png', text: "Ваше Высочество, примите золотой апельсин!", gift: "+1 Золотой апельсин" },
        { img: 'фото1.png', text: "Сир, бамбуковый посох удачи для вас!", gift: "+1 Бамбуковый посох" },
        { img: 'фото3.png', text: "О великий, мешочек зерна от нас!", gift: "+1 Мешок зерна" },
        { img: 'фото2.png', text: "Ваше Величество, этот шарф согреет вас!", gift: "+1 Шелковый шарф" },
        { img: 'фото9.png', text: "Мой господин, корона из цветов для вас!", gift: "+1 Цветочная корона" }
    ];

    function typeText(text, element, speed = 40) {
        element.innerText = "";
        let i = 0;
        let timer = setInterval(() => {
            element.innerText += text[i];
            i++;
            if (i >= text.length) clearInterval(timer);
        }, speed);
    }

    function startAudience() {
        document.getElementById('start-btn').style.display = 'none';
        showStep();
    }

    function showStep() {
        if (step < scripts.length) {
            document.getElementById('active-guest').src = scripts[step].img;
            document.getElementById('choice-buttons').style.display = 'none';
            typeText(scripts[step].text, document.getElementById('dialogue-text'));
            setTimeout(() => { document.getElementById('choice-buttons').style.display = 'flex'; }, scripts[step].text.length * 40 + 200);
        } else {
            document.getElementById('novel-box').style.display = 'none';
            document.getElementById('active-guest').style.display = 'none';
            triggerFinale();
        }
    }

    function makeChoice(accepted) {
        if (accepted) {
            let p = document.getElementById('gift-popup');
            p.innerText = scripts[step].gift;
            p.style.opacity = '1';
            setTimeout(() => { p.style.opacity = '0'; }, 1500);

            let guest = document.createElement('img');
            guest.src = scripts[step].img;
            guest.className = 'guest-back';
            guest.style.left = (5 + (step * 15)) + '%';
            document.getElementById('guests-backstage').appendChild(guest);
        }
        step++;
        showStep();
    }

    function triggerFinale() {
        for(let i = 0; i < 12; i++) {
            let guest = document.createElement('img');
            guest.src = allSprites[Math.floor(Math.random()*allSprites.length)];
            guest.className = 'guest-back';
            guest.style.left = (5 + i * 8) + '%';
            document.getElementById('guests-backstage').appendChild(guest);
        }

        let interval = setInterval(() => {
            let bubble = document.createElement('div');
            bubble.className = 'speech-bubble';
            bubble.innerText = comps[Math.floor(Math.random()*comps.length)];
            bubble.style.left = (10 + Math.random()*70) + '%';
            bubble.style.bottom = (10 + Math.random()*30) + 'vh';
            document.getElementById('scene').appendChild(bubble);
            setTimeout(() => bubble.style.opacity = '1', 50); 
        }, 200);
setTimeout(() => {
            clearInterval(interval);
            document.getElementById('scene').style.filter = "blur(20px)";
            document.getElementById('final-text').style.opacity = "1";
            
            setTimeout(() => {
                let fade = setInterval(() => {
                    if (music.volume > 0.1) music.volume -= 0.1;
                    else { clearInterval(fade); music.pause(); }
                }, 200);

                document.getElementById('scene').style.opacity = "0";
                document.querySelectorAll('.speech-bubble').forEach(b => b.style.opacity = '0');
                
                setTimeout(() => {
                    document.getElementById('final-text').style.opacity = "0";
                }, 2000);
            }, 5000);
        }, 6000);
    }
</script>
</body>
</html>
